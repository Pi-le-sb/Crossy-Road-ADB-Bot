# Crossy Road ADB Bot - Konfiguration

[adb]
# Device ID (leer = erstes Gerät)
device_id =

[game_area]
# Spielbereich auf dem Bildschirm (anpassen!)
x = 100
y = 300
width = 800
height = 600
grid_cols = 10
grid_rows = 12

[ai]
# Minimax-Suchtiefe (1-6, höher = besser aber langsamer)
minimax_depth = 4
# Zeitlimit pro Entscheidung in ms
ai_time_limit_ms = 80

[performance]
# Verzögerung zwischen Frames in ms
frame_delay_ms = 180
# Debug-Ausgaben
debug = false
